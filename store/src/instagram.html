<!doctype html>
<!-- Stand-in for a photo-sharing feed, used only to render the store
     screenshots (scripts/store-images.js). It has the article/link structure
     the extension's Instagram script keys off, with made-up accounts and no
     logos. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feed</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 Inter, sans-serif; color: #000; background: #fff; display: flex; }
  a { color: inherit; text-decoration: none; }
  nav { width: 190px; flex: none; border-right: 1px solid #dbdbdb; padding: 24px 12px; min-height: 100vh; }
  .site { font-weight: 700; font-size: 17px; padding: 0 10px 26px; color: #333; }
  nav a { display: flex; align-items: center; gap: 14px; padding: 11px 10px; border-radius: 8px; font-size: 15px; }
  .ico { width: 22px; height: 22px; border: 2px solid #000; border-radius: 6px; flex: none; }
  main { flex: 1; display: flex; justify-content: center; padding-top: 22px; }
  .feed { width: 430px; }
  .stories { display: flex; gap: 14px; margin-bottom: 22px; }
  .story { width: 58px; height: 58px; border-radius: 50%; padding: 3px; background: #c7c7c7; }
  .story div { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #fff; }
  article { border-bottom: 1px solid #efefef; padding-bottom: 14px; margin-bottom: 18px; }
  .head { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
  .av { width: 32px; height: 32px; border-radius: 50%; flex: none; }
  .name { font-weight: 600; }
  .muted { color: #737373; font-weight: 400; }
  .img { aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; }
  .reel-img { aspect-ratio: 4 / 5; }
  .bar { display: flex; gap: 14px; padding: 10px 0 4px; }
  .bar span { width: 22px; height: 22px; border: 2px solid #000; border-radius: 50%; }
  .cap { font-size: 13.5px; }
</style>
</head>
<body>
<nav>
  <div class="site">Photo feed</div>
  <a href="/"><span class="ico"></span>Home</a>
  <a href="/explore/"><span class="ico"></span>Explore</a>
  <a href="/reels/"><span class="ico" style="border-color:#e91e63"></span>Reels</a>
  <a href="/direct/inbox/"><span class="ico"></span>Messages</a>
  <a href="/me/"><span class="ico" style="border-radius:50%"></span>Profile</a>
</nav>
<main><div class="feed">
  <div class="stories"><div class="story"><div style="background:#f6d365"></div></div><div class="story"><div style="background:#84fab0"></div></div><div class="story"><div style="background:#a18cd1"></div></div><div class="story"><div style="background:#fbc2eb"></div></div><div class="story"><div style="background:#8fd3f4"></div></div></div>
  <article>
    <div class="head"><div class="av" style="background:#f6d365"></div><div class="name">sam.bakes <span class="muted">· 3h</span></div></div>
    <a href="/p/PHOTO00001/"><div class="img" style="background:linear-gradient(135deg,#f6d365,#fda085)"></div></a>
    <div class="bar"><span></span><span></span><span></span></div>
    <div class="cap"><b>sam.bakes</b> Lemon tart, attempt number four. This one stays.</div>
  </article>
  <article>
    <div class="head"><div class="av" style="background:#e91e63"></div><div class="name">trending.clips <span class="muted">· Reel</span></div></div>
    <a href="/reel/REEL000001/"><div class="img reel-img" style="background:linear-gradient(160deg,#e91e63,#7b1fa2)">▶ Reel</div></a>
    <div class="bar"><span></span><span></span><span></span></div>
    <div class="cap"><b>trending.clips</b> Keep watching 👀 #reels</div>
  </article>
  <article>
    <div class="head"><div class="av" style="background:#84fab0"></div><div class="name">nora.outdoors <span class="muted">· 6h</span></div></div>
    <a href="/p/PHOTO00002/"><div class="img" style="background:linear-gradient(180deg,#84fab0,#8fd3f4)"></div></a>
    <div class="bar"><span></span><span></span><span></span></div>
    <div class="cap"><b>nora.outdoors</b> First swim of the season.</div>
  </article>
</div></main>
</body>
</html>
