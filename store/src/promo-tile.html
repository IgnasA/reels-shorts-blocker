<!doctype html>
<!-- Small promo tile (440x280) for the Chrome Web Store, rendered to
     store/promo-tile-440x280.png by scripts/store-images.js. Uses only the
     extension's own icon and colours: no platform logos. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif;
    background: radial-gradient(circle at 85% 15%, #ff6a5f 0%, #e5322d 45%, #b3201c 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 36px;
    box-sizing: border-box;
  }
  .row { display: flex; align-items: center; gap: 18px; }
  img { width: 84px; height: 84px; border-radius: 18px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); outline: 3px solid rgba(255, 255, 255, 0.9); }
  h1 { margin: 0; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 22px 0 0; font-size: 17px; line-height: 1.35; font-weight: 500; opacity: 0.95; }
</style>
</head>
<body>
  <div class="row">
    <img src="ICON" alt="" />
    <h1>Reels &amp; Shorts<br />Blocker</h1>
  </div>
  <p>Skip the endless scroll.<br />Keep the videos you chose to watch.</p>
</body>
</html>
