name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Only cache once the repo has a lockfile (setup-node fails on a missing one).
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Validate manifest.json
        run: node .github/scripts/validate-manifest.mjs

      - name: Lint (JS syntax check)
        run: |
          set -e
          # Plain-script extension, no bundler or linter deps: parse every JS file.
          find . -name '*.js' -o -name '*.mjs' | grep -v -e node_modules -e '^./dist/' | sort | while read -r f; do
            node --check "$f"
          done

      - name: Test
        run: |
          if [ -f package.json ] && node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "No test script in package.json yet; skipping."
          fi

      - name: Build extension zip
        run: |
          set -e
          mkdir -p dist
          version=$(node -p 'require("./manifest.json").version')
          zip -r "dist/reels-shorts-blocker-${version}.zip" manifest.json settings.js content popup icons \
            -x '*.DS_Store'
          unzip -l "dist/reels-shorts-blocker-${version}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error
